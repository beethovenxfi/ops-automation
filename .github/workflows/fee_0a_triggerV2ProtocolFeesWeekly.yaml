name: Fee - 0a - Trigger protocol fees on v2 sheet pools (weekly)

on:
    schedule:
        - cron: '0 16 * * 5' # Fridays 16:00 UTC
    workflow_dispatch:

env:
    UPDATER_WALLET: ${{ secrets.UPDATER_WALLET }}

jobs:
    triggerV2ProtocolFees:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v3

            - name: Use Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.1.38
            - name: Install deps
              run: bun install --frozen-lockfile

            - name: Trigger protocol fees on v2 pools
              env:
                  GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
                  GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
                  SONIC_RPC_URL: ${{ secrets.SONIC_RPC_URL }}
              run: bun ts-node ./src/feeAutomation/triggerV2ProtocolFees.ts
