name: Fee - 0b - Trigger protocol fees on all v2 pools (monthly)

on:
    schedule:
        - cron: '0 16 26 * *' # 26th of every month 16:00 UTC
    workflow_dispatch:

env:
    UPDATER_WALLET: ${{ secrets.UPDATER_WALLET }}

jobs:
    triggerAllV2ProtocolFees:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v3

            - name: Use Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.1.38
            - name: Install deps
              run: bun install --frozen-lockfile

            - name: Trigger protocol fees on all active v2 pools
              env:
                  POOL_SOURCE: api
                  SONIC_RPC_URL: ${{ secrets.SONIC_RPC_URL }}
              run: bun ts-node ./src/feeAutomation/triggerV2ProtocolFees.ts
